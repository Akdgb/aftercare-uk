# Local Postgres for development: `docker compose up -d`
# Matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aftercare
      POSTGRES_PASSWORD: aftercare
      POSTGRES_DB: aftercare
    ports:
      - "5432:5432"
    volumes:
      - aftercare-db:/var/lib/postgresql/data

volumes:
  aftercare-db:
